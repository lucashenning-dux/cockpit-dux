name: Atualizar Cockpit DUX (tempo real)

# Disparado pelo Worker (repository_dispatch) sempre que algo muda no Linear.
# Mantém também um agendamento de segurança a cada hora, caso algum webhook se perca.
on:
  repository_dispatch:
    types: [linear-update]
  schedule:
    - cron: "0 * * * *"   # a cada hora, cheio, como rede de segurança
  workflow_dispatch: {}    # permite rodar manualmente pelo GitHub também

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Buscar dados no Linear e regenerar o board ao vivo
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: node scripts/rebuild-board.mjs

      - name: Publicar mudanças (se houver)
        run: |
          git config user.name "dux-cockpit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nada mudou no board — nada para commitar."
          else
            git commit -m "chore: atualiza board ao vivo a partir do Linear"
            git push
          fi
